<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bradford Fults</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      font-size: 18px;
      height: 100vh;
    }

    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: hsla(211, 11%, 45%, 1);
      color: hsla(219, 19%, 15%, 1);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .headshot {
      height: 10rem;
      width: 10rem;
      border-radius: 10rem;
      background-image: url("app/assets/images/headshot.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      margin-bottom: 1rem;
    }

    .name {
      margin: 0;
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 800;
      font-size: 2.25rem;
      color: hsla(219, 19%, 15%, 1);
    }
  </style>
</head>
<body>
  <div class="headshot" role="img" aria-label="Bradford Fults headshot"></div>
  <h1 class="name">Bradford Fults</h1>
</body>
</html>
